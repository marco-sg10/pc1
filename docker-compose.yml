services:
  postgres:
    image: postgres:16
    container_name: pc1-db
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pc1_pgdata:/var/lib/postgresql/data

volumes:
  pc1_pgdata: